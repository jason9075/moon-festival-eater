<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">卡通炸彈</title>
  <desc id="desc">黑色圓形卡通炸彈，帶金屬引信座、燃燒中的彎曲引線和橘紅火花。</desc>
  <defs>
    <radialGradient id="bombBody" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#5B6474"/>
      <stop offset=".38" stop-color="#303744"/>
      <stop offset="1" stop-color="#11151D"/>
    </radialGradient>
    <linearGradient id="metalFuse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset=".45" stop-color="#D99B28"/>
      <stop offset="1" stop-color="#8B5417"/>
    </linearGradient>
    <linearGradient id="fuseCord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B482A"/>
      <stop offset="1" stop-color="#2E251E"/>
    </linearGradient>
    <radialGradient id="sparkFire" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#FFF7A0"/>
      <stop offset=".35" stop-color="#FFD137"/>
      <stop offset=".72" stop-color="#FF6B20"/>
      <stop offset="1" stop-color="#E82F24"/>
    </radialGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M117 48 C126 27 143 27 151 39 C159 51 158 59 168 64"
      fill="none" stroke="#34281F" stroke-width="13"/>
    <path d="M117 48 C126 27 143 27 151 39 C159 51 158 59 168 64"
      fill="none" stroke="url(#fuseCord)" stroke-width="7" stroke-dasharray="4 6"/>

    <g stroke="#8C2E21" stroke-width="5">
      <path d="M168 64 L180 48 L177 67 L190 71 L175 77 L180 92 L166 81 L157 93 L158 77 L143 72 L159 67Z"
        fill="url(#sparkFire)"/>
      <path d="M168 64 L169 53 M177 59 L185 54 M179 72 L190 78"
        fill="none" stroke="#FF7B28" stroke-width="4"/>
    </g>

    <path d="M79 59 L84 41 Q85 35 92 35 H116 Q123 35 124 42 L128 64Z"
      fill="url(#metalFuse)" stroke="#49351F" stroke-width="7"/>
    <path d="M86 48 H122" fill="none" stroke="#FFE49A" stroke-width="5"/>

    <circle cx="100" cy="120" r="64" fill="url(#bombBody)" stroke="#090C12" stroke-width="9"/>
    <path d="M60 93 C68 75 82 66 97 63" fill="none" stroke="#FFFFFF" stroke-width="13" opacity=".8"/>
    <path d="M55 107 L53 116" fill="none" stroke="#FFFFFF" stroke-width="8" opacity=".55"/>

    <path d="M74 136 L126 84" fill="none" stroke="#171C25" stroke-width="5" opacity=".55"/>
    <path d="M75 85 L126 136" fill="none" stroke="#171C25" stroke-width="5" opacity=".55"/>
  </g>
</svg>
